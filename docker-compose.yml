services:
  # PostgreSQL Database
  db:
    image: postgres:13
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-comandas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/02_schema.sql
      - ./sql/02_add_info_columns.sql:/docker-entrypoint-initdb.d/03_add_info_columns.sql
      - ./sql/import_beverages.sql:/docker-entrypoint-initdb.d/04_import_beverages.sql
      - ./sql/beverages_fixed.json:/docker-entrypoint-initdb.d/beverages_fixed.json
      - ./sql/import_desserts_fixed.sql:/docker-entrypoint-initdb.d/05_import_desserts_fixed.sql
      - ./sql/desserts_fixed.json:/docker-entrypoint-initdb.d/desserts_fixed.json
      - ./sql/import_plates_fixed.sql:/docker-entrypoint-initdb.d/06_import_plates_fixed.sql
      - ./sql/plates_fixed.json:/docker-entrypoint-initdb.d/plates_fixed.json
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-comandas}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Adminer for database management
  adminer:
    image: adminer:latest
    container_name: adminer_pg
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres_db
      ADMINER_PASSWORD: ${ADMINER_PASSWORD:-admin123}
    networks:
      - app-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: sistema-comandas-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      DB_NAME: ${DB_NAME:-comandas}
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
    volumes:
      - backend_logs:/app/logs

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: sistema-comandas-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    name: postgres_data
  backend_logs:
    name: backend_logs
